name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  exporter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libwayland-dev libwayland-bin
      - name: Build sysguard-exporter
        run: |
          cmake -S sysguard-exporter -B sysguard-exporter/build -DCMAKE_BUILD_TYPE=Release
          cmake --build sysguard-exporter/build -j

  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Generate apis.properties
        run: |
          cat > apis.properties <<'EOF'
          SYSGUARD_EXPORTER_HOST=http://localhost:9000
          OUTLOOK_ICS_URL=https://example.com/calendar.ics
          LOCATION_MAIN_LAT=51.4545
          LOCATION_MAIN_LON=-2.5879
          LOCATION_MAIN_TIMEZONE=Europe/London
          LOCATION_ALT_LAT=24.1469
          LOCATION_ALT_LON=120.6839
          LOCATION_ALT_TIMEZONE=Asia/Taipei
          EOF
      - name: Build Android app and desktop app
        run: ./gradlew :app:assembleDebug :desktopApp:assemble --no-daemon --stacktrace
